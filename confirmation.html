
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Confirmation page for Assignment 3 in COP4813.">
    <meta name="author" content="Anthony Pilla">

    <title>Confirm Information - COP4813</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Anthony Pilla</h1>
        <p class="subtitle">COP4813 - Web Programming</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="assignments.html">My Assignments</a>
            <a href="index.html#resources">Resources</a>
        </nav>
    </header>


    <main>

        <section class="assignment-page">

            <h2>Confirm Your Information</h2>

            <p>
                Please review the information below and make sure everything
                is correct.
            </p>

            <div class="confirmation-info">

                <p>
                    <strong>Name:</strong>
                    <span id="displayName"></span>
                </p>

                <p>
                    <strong>Address:</strong>
                    <span id="displayAddress"></span>
                </p>

                <p>
                    <strong>Phone:</strong>
                    <span id="displayPhone"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="displayEmail"></span>
                </p>

                <p>
                    <strong>Birth Date:</strong>
                    <span id="displayBirthdate"></span>
                </p>

                <p>
                    <strong>Message:</strong>
                    <span id="displayMessage"></span>
                </p>

            </div>


            <div class="confirmation-buttons">

                <button type="button" onclick="confirmInformation()">
                    Confirm Information
                </button>

                <button type="button" onclick="goBack()">
                    Go Back
                </button>

            </div>

        </section>

    </main>


    <footer>
        <p>Created by Anthony Pilla | COP4813</p>
    </footer>


    <script>

    const params = new URLSearchParams(window.location.search);

    const firstName = params.get("firstName");
    const lastName = params.get("lastName");
    const address = params.get("address");
    const city = params.get("city");
    const state = params.get("state");
    const zip = params.get("zip");
    const phone = params.get("phone");
    const email = params.get("email");
    const birthdate = params.get("birthdate");
    const message = params.get("message");


    if (firstName && lastName) {

        document.getElementById("displayName").textContent =
            firstName + " " + lastName;

        document.getElementById("displayAddress").textContent =
            address + ", " + city + ", " + state + " " + zip;

        document.getElementById("displayPhone").textContent = phone;

        document.getElementById("displayEmail").textContent = email;

        document.getElementById("displayBirthdate").textContent =
            birthdate;

        document.getElementById("displayMessage").textContent =
            message;

    } else {

        document.querySelector("main").innerHTML =
            "<section class='assignment-page'>" +
            "<h2>No Information Found</h2>" +
            "<p>Please return to the form and enter your information.</p>" +
            "<a href='assignment3.html' class='assignment-button'>" +
            "Return to Form</a>" +
            "</section>";
    }


    function goBack() {
        window.history.back();
    }


    
function confirmInformation() {

    const subject = "COP4813 Assignment 3 Form Submission";

    const body =
        "Name: " + firstName + " " + lastName + "\n" +
        "Address: " + address + ", " + city + ", " + state + " " + zip + "\n" +
        "Phone: " + phone + "\n" +
        "Email: " + email + "\n" +
        "Birth Date: " + birthdate + "\n\n" +
        "Message:\n" + message;

    const mailtoLink =
        "mailto:anthony_pilla@daytonastate.edu" +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);

    window.location.href = mailtoLink;
}



</script>

</body>
</html>
