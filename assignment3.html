
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Assignment 3 - Forms</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Anthony Pilla</h1>
        <p class="subtitle">COP4813 - Web Programming</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="assignments.html">My Assignments</a>
            <a href="index.html#resources">Resources</a>
        </nav>
    </header>

    <main>

        <section class="assignment-page">

            <h2>Assignment 3 - Contact Form</h2>

            <form id="contactForm" action="confirmation.html" method="get">


        <h3>Name</h3>

        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required>
    </div>

        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>

        <h3>Address</h3>

        <div class="form-group">
            <label for="address">Street Address:</label>
            <input type="text" id="address" name="address" required>
        </div>

        <div class="form-group">
            <label for="city">City:</label>
            <input type="text" id="city" name="city" required>
        </div>

        <div class="form-group">
            <label for="state">State:</label>
            <input type="text" id="state" name="state" required>
        </div>

        <div class="form-group">
            <label for="zip">ZIP Code:</label>
            <input type="text" id="zip" name="zip" required>
        </div>

    <h3>Contact Information</h3>

        <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="(000) 000-0000"
            required
        >
    </div>

        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </div>

    <h3>Birth Date</h3>

        <div class="form-group">
            <label for="birthdate">Birth Date:</label>
            <input type="date" id="birthdate" name="birthdate" required>
        </div>

    <h3>Message</h3>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea
            id="message"
            name="message"
            rows="6"
            required
            ></textarea>
        </div>

    <h3>Confirmation</h3>

        <div class="form-group">
            <label for="security">What is 5 + 3?</label>
            <input type="text" id="security" name="security" required>
        </div>

    <button type="submit">Submit</button>


</form>


        </section>

    </main>

    <footer>
        <p>Created by Anthony Pilla | COP4813</p>
    </footer>

</body>

</html>
